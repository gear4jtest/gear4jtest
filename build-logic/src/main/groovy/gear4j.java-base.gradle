plugins {
    id 'java'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
    options.deprecation = true
    options.encoding = 'UTF-8'
    // Keep the broad compiler diagnostics enabled while excluding the two reviewed
    // baseline categories: intentionally unnamed try-with-resources handles and
    // legacy exception types awaiting serialVersionUID cleanup.
    options.compilerArgs += ['-Xlint:all,-try,-serial', '-parameters']
}

tasks.withType(Test).configureEach {
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    })
    // Test instrumentation appends to the bootstrap class path, so CDS is unavailable in test JVMs.
    jvmArgs '-Xshare:off'
    // Keep an accidentally blocked test from occupying a CI worker indefinitely.
    // More specific @Timeout declarations remain authoritative for deliberately
    // long-running integration scenarios.
    systemProperty 'junit.jupiter.execution.timeout.default', '2 m'
    systemProperty 'junit.jupiter.execution.timeout.lifecycle.method.default', '5 m'
}

tasks.withType(JavaExec).configureEach {
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    })
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addBooleanOption('quiet', true)
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('NOTICE')) {
        into 'META-INF'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
