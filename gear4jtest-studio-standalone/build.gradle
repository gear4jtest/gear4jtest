plugins { id 'application' }
ext.moduleName = 'io.github.gear4jtest.studio.standalone'
description = 'Gear4J Studio federation contracts and local demonstration launcher (experimental).'
dependencies {
    api project(':gear4jtest-studio-http')
    testImplementation project(':gear4jtest-studio-demo')
    testImplementation project(':gear4jtest-studio-spring-demo')
    testImplementation project(':gear4jtest-studio-runtime')
    testImplementation project(':gear4jtest-studio-jdbc')
    testImplementation libs.h2
}
application { mainClass = 'io.github.gear4jtest.studio.standalone.StandaloneStudioApplication' }
tasks.named('processResources') {
    from(rootProject.file('gear4jtest-studio-web/src')) { into 'studio' }
}
distributions {
    main {
        contents {
            from('example.properties')
            from('README.md')
        }
    }
}
