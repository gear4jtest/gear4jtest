name: Security scan

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle dependency metadata
        shell: bash
        run: |
          if [[ -f gradle/verification-metadata.xml ]]; then
            ./gradlew --no-daemon --dependency-verification strict help
          else
            echo "gradle/verification-metadata.xml not committed yet; see docs/security/dependency-supply-chain.md"
          fi

      - name: Run dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon dependencyCheckAggregate

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore
