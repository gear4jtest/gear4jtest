name: Studio release readiness
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studio_qualification
          POSTGRES_USER: studio_qualification
          POSTGRES_PASSWORD: synthetic-ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U studio_qualification -d studio_qualification'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GEAR4J_TEST_DATABASE_DISPOSABLE: 'true'
      GEAR4J_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/studio_qualification
      GEAR4J_TEST_POSTGRES_USER: studio_qualification
      GEAR4J_TEST_POSTGRES_PASSWORD: synthetic-ci-database-only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Install matching PostgreSQL backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Install browser from locked frontend dependencies
        working-directory: gear4jtest-studio-web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Qualify without publication
        run: ./gradlew --no-daemon --max-workers=2 studioReleaseReadiness --continue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-readiness-evidence
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            build/reports/studio-release-browser/*.json
            build/reports/studio-release-browser/*.png
            build/reports/jacoco/**
          retention-days: 14
