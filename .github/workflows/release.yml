name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, for example 1.2.3'
        required: true
        type: string
      dry-run:
        description: 'Run JReleaser in dry-run mode'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify, test and stage artifacts
        run: ./gradlew --no-daemon clean releaseCheck stageMavenCentral -PprojectVersion=${{ steps.version.outputs.value }}

      - name: Publish release through JReleaser
        env:
          JRELEASER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] == true }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew --no-daemon jreleaserDeploy -PprojectVersion=${{ steps.version.outputs.value }}

      - name: Upload staged Maven artifacts and JReleaser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-staging-${{ steps.version.outputs.value }}
          path: |
            build/staging-deploy/**
            build/jreleaser/**
          if-no-files-found: ignore
