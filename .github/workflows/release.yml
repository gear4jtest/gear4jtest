name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, for example 1.2.3'
        required: true
        type: string
      dry-run:
        description: 'Run JReleaser in dry-run mode'
        required: false
        type: boolean
        default: true
      api-baseline-version:
        description: 'Previous stable release used by Japicmp; required after 1.0.0'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release invocation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate version and trusted publication ref
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] || false }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${VERSION_INPUT}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          python3 scripts/validate_release_invocation.py \
            --version "${VERSION}" \
            --event-name "${EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --dry-run "${DRY_RUN_INPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${DRY_RUN_INPUT}" >> "${GITHUB_OUTPUT}"

  database-matrix:
    name: Release JDBC modules ${{ matrix.dialect }} integration
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgresql, mysql, mariadb, oracle]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Run selected JDBC dialect
        run: |
          ./gradlew --no-daemon \
            :gear4jtest-jdbc:integrationTest \
            :gear4jtest-external-jdbc:integrationTest \
            -Pgear4jDatabaseDialect=${{ matrix.dialect }}

      - name: Upload JDBC integration reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-jdbc-${{ matrix.dialect }}-report
          path: |
            gear4jtest-jdbc/build/test-results/integrationTest/*.xml
            gear4jtest-jdbc/build/reports/tests/integrationTest/**
            gear4jtest-jdbc/build/reports/sql-plan-qualification/**
            gear4jtest-external-jdbc/build/test-results/integrationTest/*.xml
            gear4jtest-external-jdbc/build/reports/tests/integrationTest/**
          if-no-files-found: ignore

  publish:
    name: Publish to Maven Central
    needs: [preflight, database-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6


      - name: Verify, test and stage artifacts
        env:
          PROJECT_VERSION: ${{ needs.preflight.outputs.version }}
          API_BASELINE_VERSION: ${{ inputs['api-baseline-version'] || vars.GEAR4J_API_BASELINE_VERSION }}
        shell: bash
        run: |
          BASELINE_ARGS=()
          if [[ -n "${API_BASELINE_VERSION}" ]]; then
            BASELINE_ARGS+=("-Pgear4j.apiBaselineVersion=${API_BASELINE_VERSION}")
          fi
          ./gradlew --no-daemon --warning-mode=all \
            clean releaseCheck stageMavenCentral \
            -PprojectVersion="${PROJECT_VERSION}" \
            "${BASELINE_ARGS[@]}"

      - name: Verify reproducible staged artifacts
        env:
          PROJECT_VERSION: ${{ needs.preflight.outputs.version }}
        run: scripts/verify-reproducible-staging.sh "${PROJECT_VERSION}"

      - name: Publish release through JReleaser
        env:
          JRELEASER_DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PROJECT_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          ./gradlew --no-daemon jreleaserDeploy \
            -PprojectVersion="${PROJECT_VERSION}"

      - name: Generate release evidence manifest
        env:
          PROJECT_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
          API_BASELINE_VERSION: ${{ inputs['api-baseline-version'] || vars.GEAR4J_API_BASELINE_VERSION }}
          DATABASE_MATRIX_RESULT: ${{ needs.database-matrix.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/write_release_evidence.py \
            --version "${PROJECT_VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --run-url "${RUN_URL}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --database-matrix-result "${DATABASE_MATRIX_RESULT}" \
            --dry-run "${RELEASE_DRY_RUN}" \
            --api-baseline-version "${API_BASELINE_VERSION}"

      - name: Upload staged Maven artifacts and JReleaser logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-central-staging-${{ needs.preflight.outputs.version }}
          path: |
            build/staging-deploy/**
            build/release-tools/jreleaser/**
            build/reports/release/**
            build/reports/dependency-check-report.*
            build/reports/japicmp/**
            gear4jtest-core/build/reports/jmh/**
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: ignore
