name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, integration tests, coverage and Sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle dependency metadata
        shell: bash
        run: |
          if [[ -f gradle/verification-metadata.xml ]]; then
            ./gradlew --no-daemon --dependency-verification strict help
          else
            echo "gradle/verification-metadata.xml not committed yet; see docs/security/dependency-supply-chain.md"
          fi

      - name: Build and coverage
        run: ./gradlew --no-daemon clean build coverageReport verifySupplyChainConfiguration

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./gradlew --no-daemon sonarqube

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
            **/build/test-results/integrationTest/*.xml
            **/build/reports/tests/integrationTest/**
            build/reports/jacoco/**
          if-no-files-found: ignore
