name: CI

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, integration tests, coverage and Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Prevent coverage-ratchet reductions
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_REF: ${{ github.base_ref }}
        run: scripts/verify-coverage-ratchet.py "origin/${COVERAGE_BASE_REF}"

      - name: Validate XML plugin configuration and build caches
        run: |
          ./gradlew --no-daemon \
            :gear4jtest-gradle-xml2java:test \
            --tests '*XmlAssemblyLineGeneratorFunctionalTest' \
            --configuration-cache \
            --configuration-cache-problems=fail \
            --build-cache \
            --warning-mode=all

      - name: Build and coverage
        run: |
          ./gradlew --no-daemon --warning-mode=all \
            clean build coverageReport \
            -Pgear4jDatabaseDialect=postgresql

      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "SONAR_TOKEN is not configured; skipping SonarQube scan."
            exit 0
          fi
          ./gradlew --no-daemon sonar \
            -Dsonar.qualitygate.wait=true \
            -Pgear4jDatabaseDialect=postgresql

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
            **/build/test-results/integrationTest/*.xml
            **/build/reports/tests/integrationTest/**
            build/reports/jacoco/**
          if-no-files-found: ignore

  database-matrix:
    name: JDBC modules ${{ matrix.dialect }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgresql, mysql, mariadb, oracle]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Run selected JDBC dialect
        run: |
          ./gradlew --no-daemon \
            :gear4jtest-jdbc:integrationTest \
            :gear4jtest-external-jdbc:integrationTest \
            -Pgear4jDatabaseDialect=${{ matrix.dialect }}

      - name: Upload JDBC test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jdbc-${{ matrix.dialect }}-report
          path: |
            gear4jtest-jdbc/build/test-results/integrationTest/*.xml
            gear4jtest-jdbc/build/reports/tests/integrationTest/**
            gear4jtest-external-jdbc/build/test-results/integrationTest/*.xml
            gear4jtest-external-jdbc/build/reports/tests/integrationTest/**
          if-no-files-found: ignore

  spool-confidentiality-windows:
    name: Spool confidentiality on Windows ACLs
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Verify private artifact spool ACLs
        shell: bash
        run: |
          ./gradlew --no-daemon \
            :gear4jtest-external-api:test \
            --tests '*ArtifactSpoolFilesTest' \
            --tests '*ManagedArtifactSpoolTest' \
            --warning-mode=all

  reproducibility:
    name: Reproducible staged Maven artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Verify staged artifact reproducibility
        run: scripts/verify-reproducible-staging.sh 1.0.0-reproducibility

      - name: Upload reproducibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-reports
          path: build/reports/reproducibility/**
          if-no-files-found: ignore

  performance-budget:
    name: Versioned JMH performance budgets
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Verify performance budgets
        run: |
          ./gradlew --no-daemon verifyPerformanceBudgets

      - name: Upload JMH reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jmh-performance-reports
          path: gear4jtest-core/build/reports/jmh/**
          if-no-files-found: ignore
