name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle dependency metadata
        shell: bash
        run: |
          if [[ -f gradle/verification-metadata.xml ]]; then
            ./gradlew --no-daemon --dependency-verification strict help
          else
            echo "gradle/verification-metadata.xml not committed yet; see docs/security/dependency-supply-chain.md"
          fi

      - name: Build
        run: ./gradlew --no-daemon check verifySupplyChainConfiguration

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: ignore
