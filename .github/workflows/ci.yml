name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, integration tests, coverage and Sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Verify Gradle dependency metadata
        shell: bash
        run: |
          if [[ -f gradle/verification-metadata.xml ]]; then
            ./gradlew --no-daemon --dependency-verification strict help
          else
            echo "gradle/verification-metadata.xml not committed yet; see docs/security/dependency-supply-chain.md"
          fi

      - name: Build and coverage
        run: ./gradlew --no-daemon clean build coverageReport verifySupplyChainConfiguration

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./gradlew --no-daemon sonar -Dsonar.qualitygate.wait=true

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
            **/build/test-results/integrationTest/*.xml
            **/build/reports/tests/integrationTest/**
            build/reports/jacoco/**
          if-no-files-found: ignore
