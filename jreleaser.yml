project:
  name: gear4jtest
  description: Gear4J Java pipeline orchestration library.
  longDescription: >-
    Gear4J is a Java 17 library for composing and executing typed pipelines, with optional XML, JDBC,
    Jackson, Micrometer, Spring and Gradle integrations.
  authors:
    - Gear4J contributors
  license: Apache-2.0
  links:
    homepage: https://github.com/gear4jtest/gear4jtest
  languages:
    java:
      groupId: io.github.gear4jtest
      version: 17

# JReleaser 1.25 requires one enabled release provider even when only the
# deploy command is used. GitHub is therefore configured as an inert metadata
# provider: it cannot create a tag, release, changelog, or upload assets.
release:
  github:
    enabled: true
    # JReleaser requires a non-blank token for every enabled release provider.
    # This fixed, non-secret sentinel is safe because all GitHub side effects are disabled below.
    token: not-used-maven-central-only
    skipTag: true
    skipRelease: true
    uploadAssets: NEVER
    changelog:
      enabled: false

signing:
  active: RELEASE
  pgp:
    active: RELEASE
    armored: true

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        stagingRepositories:
          - build/staging-deploy
