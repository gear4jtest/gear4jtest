    coreProjects = subprojects
}

configure(project.coreProjects) {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.release.set(17)
        options.deprecation = true
        options.encoding = 'UTF-8'
        options.compilerArgs += ["-Xlint:unchecked", "-parameters"]
    }

    tasks.withType(Test).configureEach {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        })
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        })
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            targetExclude 'build/**', '**/generated/**'

            importOrder('java|javax', '', '\\#')
            removeUnusedImports()
            eclipse()
                .configFile(rootProject.file('config/formatter/eclipse-java-formatter.xml'))

            formatAnnotations()
        }

        format 'moduleMisc', {
            target '*.gradle',
                '*.md',
                'src/**/*.xml',
                'src/**/*.xsd',
                'src/**/*.sql',
                'src/**/*.properties',
                'src/**/*.kt',
                'src/**/*.groovy'

            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    checkstyle {
        toolVersion = '10.26.1'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        configDirectory.set(rootProject.layout.projectDirectory.dir('config/checkstyle'))
    }

    tasks.withType(Checkstyle).configureEach {
        exclude '**/generated/**'
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:all,-missing', true)
        options.addBooleanOption('quiet', true)
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
        }
        from(rootProject.file('NOTICE')) {
            into 'META-INF'
        }
    }

    tasks.named('check') {
        dependsOn 'spotlessCheck'
    }

    dependencies {
        testImplementation(rootLibs.junit)
        testRuntimeOnly(rootLibs.junit.platform.launcher)
        testImplementation(rootLibs.assertj)
    }

    sourceSets {
        integrationTest {
            java.srcDir file('src/integrationTest/java')
            resources.srcDir file('src/integrationTest/resources')
            compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            runtimeClasspath += output + compileClasspath
        }
    }

    configurations {
        integrationTestImplementation.extendsFrom testImplementation
        integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    }

    test {
        useJUnitPlatform()
    }

    tasks.register('integrationTest', Test) {
        description = 'Runs integration tests. Database-dependent tests use Testcontainers.'
        group = 'verification'
        testClassesDirs = sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.integrationTest.runtimeClasspath
        useJUnitPlatform()
        shouldRunAfter tasks.named('test')
    }

    jacocoTestReport {
        reports {
            xml.required = true
        }
    }
}

