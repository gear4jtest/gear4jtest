tasks.register('verifyDependencyCheckSuppressions') {
    group = 'verification'
    description = 'Requires every OWASP Dependency-Check suppression to have an explicit expiry date.'

    def suppressionFile = layout.projectDirectory.file('config/dependency-check-suppressions.xml')
    inputs.file(suppressionFile)

    doLast {
        def document = new groovy.xml.XmlSlurper(false, false).parse(suppressionFile.asFile)
        def missingExpiry = document.suppress.findAll { suppression ->
            suppression.until.text().trim().isEmpty()
        }
        if (!missingExpiry.isEmpty()) {
            throw new GradleException('Every dependency-check suppression must declare an <until> expiry date')
        }
    }
}

