tasks.register('verifyDatabaseTestDependencyScope') {
    group = 'verification'
    description = 'Prevents database drivers and Testcontainers dependencies from leaking into unrelated modules.'

    doLast {
        def allowedProjects = [project(':gear4jtest-jdbc'), project(':gear4jtest-external-jdbc')] as Set
        def springBootStarter = project(':gear4jtest-spring-boot-starter')
        def databaseGroups = [
            'org.testcontainers',
            'org.postgresql',
            'com.mysql',
            'org.mariadb.jdbc',
            'com.oracle.database.jdbc',
            'com.h2database'
        ] as Set
        def violations = []
        coreProjects.findAll { !allowedProjects.contains(it) }.each { candidate ->
            candidate.configurations.each { configuration ->
                configuration.dependencies.findAll { dependency ->
                    def isDatabaseDependency = dependency.group != null
                            && databaseGroups.contains(dependency.group)
                    def isSpringTransactionTestDependency = candidate == springBootStarter
                            && configuration.name == 'testImplementation'
                            && dependency.group == 'com.h2database'
                            && dependency.name == 'h2'
                    isDatabaseDependency && !isSpringTransactionTestDependency
                }.each { dependency ->
                    def coordinate = [dependency.group, dependency.name, dependency.version].join(':')
                    violations << "${candidate.path}:${configuration.name} -> ${coordinate}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('Database test dependencies leaked outside JDBC modules:\n - '
                    + violations.join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDatabaseTestDependencyScope')
}

def supportedDatabaseDialects = ['postgresql', 'mysql', 'mariadb', 'oracle']
def selectedDatabaseDialect = providers.gradleProperty('gear4jDatabaseDialect')
    .map { it.trim().toLowerCase(java.util.Locale.ROOT) }
    .orElse('all')

tasks.register('verifyDatabaseDialectSelection') {
    group = 'verification'
    description = 'Validates the requested JDBC integration-test dialect.'
    inputs.property('gear4jDatabaseDialect', selectedDatabaseDialect)

    doLast {
        def selected = selectedDatabaseDialect.get()
        if (selected != 'all' && !supportedDatabaseDialects.contains(selected)) {
            throw new GradleException('Unsupported gear4jDatabaseDialect: ' + selected
                + '. Expected one of: all, ' + supportedDatabaseDialects.join(', '))
        }
    }
}

configure([project(':gear4jtest-jdbc'), project(':gear4jtest-external-jdbc')]) { testedProject ->
    testedProject.tasks.named('integrationTest') {
        dependsOn rootProject.tasks.named('verifyDatabaseDialectSelection')
        systemProperty 'gear4j.test.databaseDialect', selectedDatabaseDialect.get()
    }
}

