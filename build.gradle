tasks.register('jacocoCriticalCoverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Enforces branch-coverage ratchets on the runtime, concurrency, migration and publication hot spots.'

    dependsOn coreProjects.collect { it.tasks.named('test') }
    dependsOn coreProjects.collect { it.tasks.named('integrationTest') }
