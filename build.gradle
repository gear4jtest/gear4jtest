def repositoryRootDirectory = layout.projectDirectory.asFile
def releaseMarkdownFiles = files(
    layout.projectDirectory.file('README.md'),
    fileTree(layout.projectDirectory.dir('docs')) {
        include '**/*.md'
    },
    fileTree(layout.projectDirectory) {
        include 'gear4jtest-*/README.md'
    })

tasks.register('verifyDocumentationLinks') {
    group = 'verification'
    description = 'Checks that repository-local Markdown links resolve to existing files.'
    inputs.files(releaseMarkdownFiles)

    doLast {
        def brokenLinks = []
        releaseMarkdownFiles.files.findAll { it.isFile() }.sort().each { markdownFile ->
            def source = markdownFile.getText('UTF-8')
            def matcher = source =~ /!?\[[^\]]*\]\(([^)]+)\)/
            matcher.each { match ->
                def expression = match[1].trim()
                def target
                if (expression.startsWith('<') && expression.contains('>')) {
                    target = expression.substring(1, expression.indexOf('>'))
                } else {
                    target = expression.split(/\s+/, 2)[0]
                }
                if (target.isEmpty() || target.startsWith('#')
                        || target ==~ /(?i)^[a-z][a-z0-9+.-]*:.*/) {
                    return
                }

                def pathOnly = target.split('#', 2)[0].split(/\?/, 2)[0]
                if (pathOnly.isEmpty()) {
                    return
                }
                def resolved = new File(markdownFile.parentFile, pathOnly).canonicalFile
                if (!resolved.exists()) {
                    def relativeSource = repositoryRootDirectory.toPath().relativize(markdownFile.toPath())
                    brokenLinks << "${relativeSource}: ${target}"
                }
            }
        }
        if (!brokenLinks.isEmpty()) {
            throw new GradleException('Broken repository-local Markdown links:\n - ' + brokenLinks.join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDocumentationLinks')
}

def javaSources = fileTree(layout.projectDirectory) {
    include 'gear4jtest-*/src/**/*.java'
}

tasks.register('verifySuppressWarningsBudget') {
    group = 'verification'
    description = 'Prevents unchecked-warning suppressions from growing without an explicit review.'
    inputs.files(javaSources)

    doLast {
        def productionCount = 0
        def supportCount = 0
        def forbidden = []

        javaSources.files.findAll { it.isFile() }.sort().each { sourceFile ->
            def source = sourceFile.getText('UTF-8')
            def count = (source =~ /(?m)^[\t ]*@SuppressWarnings\b/).count
            if (sourceFile.path.replace('\\', '/').contains('/src/main/')) {
                productionCount += count
            } else {
                supportCount += count
            }
            if (source =~ /@SuppressWarnings\s*\(\s*"all"\s*\)/) {
                forbidden << repositoryRootDirectory.toPath().relativize(sourceFile.toPath())
            }
        }

        def failures = []
        if (productionCount > 29) {
            failures << "production suppressions: ${productionCount} (budget: 29)"
        }
        if (supportCount > 9) {
            failures << "test, integration and benchmark suppressions: ${supportCount} (budget: 9)"
        }
        if (!forbidden.isEmpty()) {
            failures << "@SuppressWarnings(\"all\") is forbidden in: ${forbidden.sort().join(', ')}"
        }
        if (!failures.isEmpty()) {
            throw new GradleException('SuppressWarnings quality budget exceeded. Remove or narrowly justify the '
                    + 'new suppression before changing the reviewed budget:\n - ' + failures.join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifySuppressWarningsBudget')
}

def decisionFiles = fileTree(layout.projectDirectory.dir('docs/decisions')) {
    include '*.md'
}

tasks.register('verifyDecisionIdentifiers') {
    group = 'verification'
    description = 'Checks that ADR filenames use unique four-digit identifiers.'
    inputs.files(decisionFiles)

    doLast {
        def invalidNames = []
        def filesByIdentifier = [:].withDefault { [] }
        decisionFiles.files.findAll { it.isFile() }.sort().each { decisionFile ->
            def matcher = decisionFile.name =~ /^(\d{4})-.+\.md$/
            if (!matcher.matches()) {
                invalidNames << decisionFile.name
            } else {
                filesByIdentifier[matcher.group(1)] << decisionFile.name
            }
        }

        def duplicateIdentifiers = filesByIdentifier.findAll { identifier, files -> files.size() > 1 }
        def failures = invalidNames.sort().collect { "invalid filename: ${it}" }
        duplicateIdentifiers.keySet().sort().each { identifier ->
            failures << "duplicate ADR ${identifier}: ${filesByIdentifier[identifier].sort().join(', ')}"
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Invalid ADR identifiers:\n - ' + failures.join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDecisionIdentifiers')
}

def livingDocumentationFiles = files(
    fileTree(layout.projectDirectory.dir('docs/roadmap')) {
        include '*.md'
    },
    layout.projectDirectory.file('docs/architecture/micrometer-observability.md'),
    layout.projectDirectory.file('gear4jtest-micrometer/README.md'))

tasks.register('verifyLivingDocumentationMetadata') {
    group = 'verification'
    description = 'Checks owner, status and review-date metadata on living documentation.'
    inputs.files(livingDocumentationFiles)

    doLast {
        def failures = []
        livingDocumentationFiles.files.findAll { it.isFile() }.sort().each { documentationFile ->
            def metadata = [:]
            def matcher = documentationFile.getText('UTF-8') =~
                /(?m)^\|\s*(Status|Owner|Last reviewed)\s*\|\s*([^|]+?)\s*\|\s*$/
            matcher.each { match ->
                metadata[match[1]] = match[2].trim()
            }

            def relativePath = repositoryRootDirectory.toPath().relativize(documentationFile.toPath())
            ['Status', 'Owner', 'Last reviewed'].each { field ->
                if (!metadata[field]) {
                    failures << "${relativePath}: missing ${field} metadata"
                }
            }
            if (metadata['Last reviewed']) {
                try {
                    java.time.LocalDate.parse(metadata['Last reviewed'])
                } catch (java.time.format.DateTimeParseException ignored) {
                    failures << "${relativePath}: Last reviewed must use YYYY-MM-DD"
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Invalid living-documentation metadata:\n - ' + failures.join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyLivingDocumentationMetadata')
}

def workflowFiles = fileTree(layout.projectDirectory.dir('.github/workflows')) {
    include '*.yml', '*.yaml'
}

tasks.register('verifyWorkflowSecurity') {
    group = 'verification'
    description = 'Checks job timeouts and keeps workflow secrets scoped to individual steps.'
    inputs.files(workflowFiles)

    doLast {
        def failures = []
        def indentationOf = { String line ->
            int indentation = 0
            while (indentation < line.length() && line.charAt(indentation) == ' '.charAt(0)) {
                indentation++
            }
            indentation
        }
        workflowFiles.files.sort().each { workflowFile ->
            def lines = workflowFile.readLines('UTF-8')
            def jobsLine = lines.findIndexOf { it == 'jobs:' }
            if (jobsLine < 0) {
                failures << "${workflowFile.name}: missing jobs section"
                return
            }

            int jobsEnd = lines.size()
            for (int lineIndex = jobsLine + 1; lineIndex < lines.size(); lineIndex++) {
                def line = lines[lineIndex]
                if (!line.trim().isEmpty() && indentationOf(line) == 0) {
                    jobsEnd = lineIndex
                    break
                }
            }
            def jobStarts = []
            lines.eachWithIndex { line, index ->
                if (index > jobsLine && index < jobsEnd) {
                    def matcher = line =~ /^  ([A-Za-z0-9_-]+):\s*$/
                    if (matcher.matches()) {
                        jobStarts << [name: matcher.group(1), index: index]
                    }
                }
            }
            if (jobStarts.isEmpty()) {
                failures << "${workflowFile.name}: no jobs found"
                return
            }

            jobStarts.eachWithIndex { jobStart, jobIndex ->
                def endIndex = jobIndex + 1 < jobStarts.size()
                    ? jobStarts[jobIndex + 1].index
                    : jobsEnd
                def jobLines = lines.subList(jobStart.index + 1, endIndex)
                def timeoutMatches = jobLines.collect { line ->
                    def matcher = line =~ /^    timeout-minutes:\s*(\d+)\s*$/
                    matcher.matches() ? Integer.parseInt(matcher.group(1)) : null
                }.findAll { it != null }
                if (timeoutMatches.size() != 1) {
                    failures << "${workflowFile.name}:${jobStart.name}: expected one numeric job timeout"
                } else if (timeoutMatches[0] < 1 || timeoutMatches[0] > 360) {
                    failures << "${workflowFile.name}:${jobStart.name}: timeout must be between 1 and 360 minutes"
                }

                jobLines.eachWithIndex { line, lineIndex ->
                    if (line == '    env:') {
                        for (int environmentIndex = lineIndex + 1;
                                environmentIndex < jobLines.size();
                                environmentIndex++) {
                            def candidate = jobLines[environmentIndex]
                            if (!candidate.trim().isEmpty() && indentationOf(candidate) <= 4) {
                                break
                            }
                            if (candidate ==~ /^      (SONAR_TOKEN|GITHUB_TOKEN):.*$/) {
                                failures << "${workflowFile.name}:${jobStart.name}: secret declared in job env: "
                                    + candidate.trim().split(':', 2)[0]
                            }
                        }
                    }

                    if (line.contains('${{ secrets.')) {
                        def indentation = indentationOf(line)
                        def enclosingLine = jobLines.subList(0, lineIndex).reverse().find { candidate ->
                            !candidate.trim().isEmpty()
                                    && indentationOf(candidate) <= 8
                        }
                        if (indentation < 10 || enclosingLine != '        env:') {
                            failures << "${workflowFile.name}:${jobStart.name}: secret must be declared in step env"
                        }
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Workflow security policy violations:\n - ' + failures.join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyWorkflowSecurity')
}

tasks.register('verifyReleaseWorkflowContract') {
    group = 'verification'
    description = 'Keeps release preflight, metadata validation and evidence generation wired into CI.'

    def ciWorkflow = layout.projectDirectory.file('.github/workflows/ci.yml')
    def releaseWorkflow = layout.projectDirectory.file('.github/workflows/release.yml')
    inputs.files(ciWorkflow, releaseWorkflow)

    doLast {
        def requiredFragments = [
            (ciWorkflow): [
                "python3 -m unittest discover -s scripts -p 'test_*.py'",
                'clean build coverageReport releaseMetadataCheck'
            ],
            (releaseWorkflow): [
                'preflight:',
                'needs: [preflight, database-matrix]',
                'python3 scripts/validate_release_invocation.py',
                'python3 scripts/write_release_evidence.py',
                'build/reports/release/**'
            ]
        ]
        def failures = []
        requiredFragments.each { workflow, fragments ->
            def source = workflow.asFile.getText('UTF-8')
            fragments.findAll { !source.contains(it) }.each { missing ->
                failures << "${workflow.asFile.name}: missing release contract fragment: ${missing}"
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Release workflow contract violations:\n - '
                + failures.join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseWorkflowContract')
}

