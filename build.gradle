tasks.register('verifyDependencyCheckSuppressions') {
    group = 'verification'
    description = 'Requires every OWASP Dependency-Check suppression to have an explicit expiry date.'

    def suppressionFile = layout.projectDirectory.file('config/dependency-check-suppressions.xml')
    inputs.file(suppressionFile)

    doLast {
        def document = new groovy.xml.XmlSlurper(false, false).parse(suppressionFile.asFile)
        def missingExpiry = document.suppress.findAll { suppression ->
            suppression.until.text().trim().isEmpty()
        }
        if (!missingExpiry.isEmpty()) {
            throw new GradleException('Every dependency-check suppression must declare an <until> expiry date')
        }
    }
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    suppressionFiles = [layout.projectDirectory.file('config/dependency-check-suppressions.xml').asFile.absolutePath]
    formats = ['HTML', 'JSON']
    analyzers {
        assemblyEnabled = false
    }
    if (System.getenv('NVD_API_KEY')) {
        nvd {
            apiKey = System.getenv('NVD_API_KEY')
        }
    }
}


tasks.matching { it.name == 'dependencyCheckAggregate' || it.name == 'dependencyCheckAnalyze' }.configureEach {
    dependsOn tasks.named('verifyDependencyCheckSuppressions')
}

tasks.matching { it.name == 'sonarqube' || it.name == 'sonar' }.configureEach {
    dependsOn tasks.named('coverageReport')
}

def obsoletePromotedCoreTypes = [
    'io/github/gear4jtest/core/execution/AssemblyRunManager',
    'io/github/gear4jtest/core/execution/PersistenceOperationalStatus',
    'io/github/gear4jtest/core/execution/PersistenceRuntimeMonitor',
    'io/github/gear4jtest/core/execution/PersistenceRuntimeStats',
    'io/github/gear4jtest/core/engine/support/WorkerConcurrencyConfiguration',
    'io/github/gear4jtest/core/engine/support/WorkerConcurrencyPolicy',
    'io/github/gear4jtest/core/engine/support/WorkerConcurrencyRegistryConfiguration',
    'io/github/gear4jtest/core/engine/support/WorkerConcurrencyStrategy',
    'io/github/gear4jtest/core/engine/support/WorkerLockAcquisitionPolicy'
]
def coreBinaryJar = project(':gear4jtest-core').tasks.named('jar', Jar).flatMap { it.archiveFile }
def coreSourcesJar = project(':gear4jtest-core').tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }

tasks.register('verifyCoreArtifactApiSurface') {
    group = 'verification'
    description = 'Prevents obsolete pre-promotion API types from returning in the core binary and sources JARs.'
    dependsOn project(':gear4jtest-core').tasks.named('jar'),
        project(':gear4jtest-core').tasks.named('sourcesJar')
    inputs.files(coreBinaryJar, coreSourcesJar)

    doLast {
        def violations = []
        [coreBinaryJar.get().asFile, coreSourcesJar.get().asFile].each { jarFile ->
            new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
                archive.entries().each { entry ->
                    def obsoleteType = obsoletePromotedCoreTypes.find { typePath ->
                        entry.name == typePath + '.class'
                                || entry.name == typePath + '.java'
                                || (entry.name.startsWith(typePath + '$') && entry.name.endsWith('.class'))
                    }
                    if (obsoleteType != null) {
                        violations << "${jarFile.name}: ${entry.name}"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException('Obsolete promoted API types found in core artifacts:\n - '
                    + violations.sort().join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCoreArtifactApiSurface')
}

