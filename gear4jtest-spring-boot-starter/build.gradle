dependencies {
    api project(':gear4jtest-spring')
    api project(':gear4jtest-jdbc')
    api libs.spring.jdbc
    implementation project(':gear4jtest-micrometer')
    implementation libs.spring.boot.autoconfigure
    implementation libs.spring.boot.starter.validation
    implementation(libs.log4j.api) {
        because 'Spring Boot 3.5.16 manages Log4j 2.24.3, affected by CVE-2026-49844'
    }
    implementation(libs.log4j.to.slf4j) {
        because 'Keep the Log4j-to-SLF4J bridge aligned with the patched Log4j API line'
    }
    compileOnlyApi libs.spring.boot.actuator

    annotationProcessor libs.spring.boot.configuration.processor

    testImplementation libs.spring.boot.test
    testImplementation libs.spring.test
    testImplementation libs.spring.boot.actuator
    testImplementation libs.h2
    testImplementation project(':gear4jtest-external-jdbc')
}

ext.moduleName = 'io.github.gear4jtest.spring.boot.starter'
