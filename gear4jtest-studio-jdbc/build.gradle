ext.moduleName = 'io.github.gear4jtest.studio.jdbc'
description = 'Gear4J Studio jdbc adapter (experimental).'
dependencies {
    api project(':gear4jtest-studio')
    api project(':gear4jtest-jdbc')
    implementation project(':gear4jtest-studio-json')
    testImplementation libs.h2
    integrationTestImplementation libs.testcontainers.junit.jupiter
    integrationTestImplementation libs.testcontainers.postgresql
    integrationTestImplementation libs.postgresql
}

// An explicit release gate must fail rather than silently skip without a service.
tasks.named('integrationTest') { useJUnitPlatform { excludeTags 'studio-release-postgres' } }
tasks.register('studioPostgresQualification', Test) {
    group = 'verification'
    description = 'Qualifies Studio on a dedicated real PostgreSQL service; no Docker/H2 fallback.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform { includeTags 'studio-release-postgres' }
    outputs.upToDateWhen { false }
}
