apply plugin: 'groovy'

dependencies {
    implementation project(':gear4jtest-core')
    implementation project(':gear4jtest-external-api')
    implementation project(':gear4jtest-xml')

    testImplementation gradleTestKit()
    testImplementation(libs.junit)
    testRuntimeOnly(libs.junit.platform.launcher)
    testImplementation(libs.assertj)
}

sourceSets {
    compatibilityTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    compatibilityTestImplementation.extendsFrom testImplementation
    compatibilityTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('gradlePluginCompatibilityTest', Test) {
    group = 'verification'
    description = 'Runs the versioned Gradle plugin DSL compatibility fixtures against the current plugin.'
    dependsOn tasks.named('pluginUnderTestMetadata')
    testClassesDirs = sourceSets.compatibilityTest.output.classesDirs
    classpath = sourceSets.compatibilityTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('gradlePluginCompatibilityTest')
}

def publicDslDocumentationEntry =
    'io/github/gear4jtest/xml2java/XmlAssemblyLineGeneratorExtension.html'
def publicDslGroovydoc = tasks.named(
    'groovydoc', org.gradle.api.tasks.javadoc.Groovydoc) {
    source = sourceSets.main.groovy.matching {
        include '**/XmlAssemblyLineGeneratorExtension.groovy'
    }
    noTimestamp = true
    noVersionStamp = true
}

tasks.named('javadoc') {
    onlyIf {
        source.files.any { sourceFile ->
            sourceFile.name != 'package-info.java' && sourceFile.name != 'module-info.java'
        }
    }
}

tasks.register('javadocJar', Jar) {
    dependsOn publicDslGroovydoc
    archiveClassifier = 'javadoc'
    from(publicDslGroovydoc.flatMap { it.destinationDirectory })
    inputs.property('publicDslDocumentationEntry', publicDslDocumentationEntry)

    doLast {
        def expectedEntry = inputs.properties['publicDslDocumentationEntry']
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { archive ->
            if (archive.getEntry(expectedEntry) == null) {
                throw new GradleException(
                    "Gradle plugin documentation is missing ${expectedEntry}")
            }
        }
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

def projectHomepage = 'https://github.com/gear4jtest/gear4jtest'

publishing {
    repositories {
        maven {
            name = 'mavenCentralStaging'
            url = rootProject.layout.buildDirectory.dir('staging-deploy')
        }
    }

    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Gear4J XML to Java Gradle plugin'
            description = 'Generates Java Gear4J assembly lines from XML definitions.'
            url = projectHomepage

            licenses {
                license {
                    name = 'Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'gear4jtest'
                    name = 'Gear4J contributors'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/gear4jtest/gear4jtest.git'
                developerConnection = 'scm:git:ssh://git@github.com/gear4jtest/gear4jtest.git'
                url = projectHomepage
                tag = project.version.toString().endsWith('-SNAPSHOT') ? 'HEAD' : "v${project.version}"
            }
        }
    }
}

gradlePlugin {
    testSourceSets.add(sourceSets.compatibilityTest)

    plugins {
        create("gear4jXmlAssemblyLineGenerator") {
            id = "io.github.gear4jtest.xml2java"
            implementationClass = "io.github.gear4jtest.xml2java.XmlAssemblyLineGeneratorPlugin"
        }
        create("gear4jXmlAssemblyLineGeneratorLegacy") {
            id = "io.github.gear4jtest.gradle.xml2java"
            implementationClass = "io.github.gear4jtest.xml2java.XmlAssemblyLineGeneratorPlugin"
        }
    }
}

ext.moduleName = 'io.github.gear4jtest.gradle.xml2java'

tasks.named('jar', Jar) {
    inputs.property('moduleName', project.moduleName)
    manifest.attributes(
        'Automatic-Module-Name': project.moduleName
    )
}
