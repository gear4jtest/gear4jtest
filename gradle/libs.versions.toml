spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-actuator", version.ref = "spring-boot" }
eclipse-jdt-core = { module = "org.eclipse.jdt:org.eclipse.jdt.core", version.ref = "eclipse-jdt-core" }
eclipse-text = { module = "org.eclipse.platform:org.eclipse.text", version.ref = "eclipse-text" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
jmh-gradle-plugin = { module = "me.champeau.jmh:me.champeau.jmh.gradle.plugin", version.ref = "jmh-gradle-plugin" }
