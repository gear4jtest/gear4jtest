ext.moduleName = 'io.github.gear4jtest.studio.demo'
description = 'Gear4J Studio P2 studio-demo (experimental).'
dependencies {
    implementation project(':gear4jtest-studio-runtime')
    implementation project(':gear4jtest-studio-json')
    implementation project(':gear4jtest-studio-jdbc')
    implementation libs.h2
    implementation libs.jackson
    implementation libs.jackson.datatype.jsr310
    implementation libs.slf4j
    runtimeOnly libs.logback
}

tasks.register('runStudio', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.gear4jtest.studio.demo.PlainStudioApplication'
}

// Demonstration applications are distributed in source, not published.
tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    enabled = false
}

tasks.register('studioFrontendInstall', Exec) {
    group = 'build setup'
    description = 'Installs locked development-only DOM test dependencies.'
    workingDir rootProject.file('gear4jtest-studio-web')
    environment 'npm_config_cache', rootProject.file('gear4jtest-studio-web/.npm-cache').absolutePath
    inputs.files('../gear4jtest-studio-web/package.json', '../gear4jtest-studio-web/package-lock.json')
    outputs.dir('../gear4jtest-studio-web/node_modules')
    commandLine 'npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'
}

tasks.register('studioComponentTest', Exec) {
    group = 'verification'
    dependsOn 'studioFrontendInstall'
    workingDir rootProject.file('gear4jtest-studio-web')
    commandLine 'npm', 'test'
}

tasks.named('check') {
    dependsOn 'studioComponentTest'
}

// Use the published Studio Web sources for shared ESM modules.
// Demo-specific HTML, bootstrap and CSS stay in src/main/resources/studio.
// Do not duplicate the shared .mjs files there: Gradle must fail on collisions.
tasks.named('processResources') {
    from(rootProject.file('gear4jtest-studio-web/src')) { into 'studio' }
}
tasks.register('studioPackageCheck', Exec) {
    group = 'verification'
    dependsOn 'studioFrontendInstall'
    workingDir rootProject.file('gear4jtest-studio-web')
    environment 'npm_config_cache', rootProject.file('gear4jtest-studio-web/.npm-cache').absolutePath
    commandLine 'npm', 'run', 'pack:check'
}
tasks.named('check') { dependsOn 'studioPackageCheck' }
