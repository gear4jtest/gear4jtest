# Dependency-Check's aggregate vulnerability analysis runs inside the Gradle
# daemon and needs substantially more heap than Gradle's 512 MiB default on
# this multi-module build. Keep this project-local so releaseCheck remains
# reproducible without requiring developers to configure GRADLE_OPTS manually.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
