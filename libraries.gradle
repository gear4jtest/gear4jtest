// Allows centralized definition of the version of artifacts to
// use.  In that respect it serves a role similar to <dependencyManagement> in Maven
ext {
    junitVersion = '5.9.3'
    junitPlatformVersion = '1.9.3'
    slf4jVersion = '2.0.17'
    assertjVersion = '3.24.2'
    logbackVersion = '1.5.18'
    mockitoVersion = '4.6.0'
    micrometerVersion = '1.15.1'
    springBootVersion = '3.5.3'

    libraries = [
        // compile
        slf4j        : "org.slf4j:slf4j-api:${slf4jVersion}",
        google       : "com.google.guava:guava:33.0.0-jre",
        jackson      : "com.fasterxml.jackson.core:jackson-databind:2.19.0",

        // testCompile
        junit        : "org.junit.jupiter:junit-jupiter:${junitVersion}",
        junitPlatformLauncher : "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}",
        assertj      : "org.assertj:assertj-core:${assertjVersion}",
        logback      : "ch.qos.logback:logback-classic:${logbackVersion}",
        mockito      : "org.mockito:mockito-core:${mockitoVersion}",
        mockitoJunit : "org.mockito:mockito-junit-jupiter:${mockitoVersion}",
        postgresql   : "org.postgresql:postgresql:42.7.7",
        micrometer   : "io.micrometer:micrometer-core:${micrometerVersion}",
        springBootAutoconfigure : "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}",
        springBootTest : "org.springframework.boot:spring-boot-test:${springBootVersion}",
        springTest : 'org.springframework:spring-test:6.2.8',
        springBootConfigurationProcessor : "org.springframework.boot:spring-boot-configuration-processor:${springBootVersion}",
        springBootStarterValidation : "org.springframework.boot:spring-boot-starter-validation:${springBootVersion}"
    ]
}
