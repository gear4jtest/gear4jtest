def projectArtifactId = project.name
def projectDisplayName = projectArtifactId
        .replace('gear4jtest-', 'Gear4J ')
        .replace('-', ' ')

def projectDescription = project.description ?: 'Gear4J Java pipeline orchestration library.'

def projectHomepage = 'https://github.com/gear4jtest/gear4jtest'

def stagingRepositoryDir = rootProject.layout.buildDirectory.dir('staging-deploy')

java {
    withSourcesJar()
    withJavadocJar()
}

normalization {
    runtimeClasspath {
        metaInf {
            ignoreAttribute('Created-By')
            ignoreAttribute('Implementation-Version')
            ignoreAttribute('Specification-Version')
        }
    }
}

jar {
    manifest {
        attributes(
            'Created-By': System.properties['java.version'] + ' (' + System.properties['java.vendor'] + ')',
            'Specification-Title': projectArtifactId,
            'Specification-Version': project.version,
            'Implementation-Title': projectArtifactId,
            'Implementation-Version': project.version,
            'Automatic-Module-Name': project.findProperty('moduleName') ?: project.name.replace('-', '.')
        )
    }
}

publishing {
    repositories {
        maven {
            name = 'mavenCentralStaging'
            url = stagingRepositoryDir
        }
    }

    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = projectArtifactId

            pom {
                name = projectDisplayName
                description = projectDescription
                url = projectHomepage

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'gear4jtest'
                        name = 'Gear4J contributors'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/gear4jtest/gear4jtest.git'
                    developerConnection = 'scm:git:ssh://git@github.com/gear4jtest/gear4jtest.git'
                    url = projectHomepage
                    tag = project.version.toString().endsWith('-SNAPSHOT') ? 'HEAD' : "v${project.version}"
                }
            }
        }
    }
}
